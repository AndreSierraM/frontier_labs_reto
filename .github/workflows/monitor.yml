name: monitor

# Disparador gratuito y frecuente (Vercel Hobby limita sus crons a 1/día).
# Llama al endpoint de monitorización desplegado, que corre la batería contra
# el original, guarda snapshot y registra eventos si algo cambió.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar monitor
        id: monitor
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/monitor.json -w "%{http_code}" \
            "https://frontier-labs-reto.vercel.app/api/monitor/run" \
            -H "Authorization: Bearer ${MONITOR_TOKEN}")
          echo "HTTP ${code}"
          cat /tmp/monitor.json
          test "${code}" = "200"
          changed=$(jq -r '.changes | length' /tmp/monitor.json)
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Cambios detectados: ${changed}"

      - name: Despertar al agente de adaptación
        if: steps.monitor.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=original-changed
name: monitor

# Vigilancia del original + disparo del enjambre en el MISMO run.
# Se usa un workflow reutilizable (swarm.yml) porque GitHub no permite que un
# workflow dispare a otro con el GITHUB_TOKEN.
#
# Modos:
#  - `schedule`: `check` (batería) cada 15 min y `recon` (mapa ampliado) cada 2 h.
#    Presupuesto: 96×32 + 12×101 ≈ 4.284 req/día (el original admite 8.000/día
#    y 10 req/s por token; ver frontier-reto-2/README.md).
#  - `workflow_dispatch` con loop_minutes>0: tick inmediato + bucle cada 15 min
#    hasta detectar un cambio (o agotar los minutos) y acto seguido adapta.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutos a vigilar en bucle (0 = una sola pasada)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------- una pasada
  check:
    name: Una pasada
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') || github.event.inputs.loop_minutes == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.monitor.outputs.changed }}
    steps:
      - name: "Fase 1 · Consultar el monitor"
        id: monitor
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::GET /api/monitor/run"
          code=$(curl -sS -o /tmp/monitor.json -w "%{http_code}" \
            "https://frontier-labs-reto.vercel.app/api/monitor/run" \
            -H "Authorization: Bearer ${MONITOR_TOKEN}") || true
          echo "HTTP ${code}"
          cat /tmp/monitor.json 2>/dev/null || true
          echo "::endgroup::"
          changed=0
          if [ "${code}" = "200" ]; then
            n=$(jq -r '.changes | length // 0' /tmp/monitor.json 2>/dev/null || echo 0)
            [ "${n}" != "0" ] && changed=1
          else
            echo "::warning::el monitor respondió ${code}; se omite esta pasada"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------- recon (mapa ampliado)
  recon:
    name: Recon (mapa ampliado)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '5 */2 * * *') || github.event.inputs.loop_minutes == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.recon.outputs.changed }}
    steps:
      - name: "Fase 1 · Checkout"
        uses: actions/checkout@v4
      - name: "Fase 1 · Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Fase 2 · Sondear el original (batería + descubrimiento)"
        id: recon
        env:
          MONITOR_URL: https://frontier-labs-reto.vercel.app
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          URL_API_ENTRYPOINT: ${{ secrets.URL_API_ENTRYPOINT }}
          TOKEN_CAJA_NEGRA: ${{ secrets.TOKEN_CAJA_NEGRA }}
        run: node agent/recon.mjs

  # -------------------------------------------------------- bucle demo day
  watch:
    name: Bucle de vigilancia
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.loop_minutes != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      changed: ${{ steps.loop.outputs.changed || steps.tick.outputs.changed }}
    steps:
      # Bloque 1: un tick inmediato, para no esperar 15 min al primer chequeo.
      - name: "Fase 1 · Tick inmediato"
        id: tick
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::tick 1 · $(date -u +%H:%M:%SZ)"
          code=$(curl -sS -o /tmp/monitor.json -w "%{http_code}" \
            "https://frontier-labs-reto.vercel.app/api/monitor/run" \
            -H "Authorization: Bearer ${MONITOR_TOKEN}") || true
          echo "HTTP ${code}"
          cat /tmp/monitor.json 2>/dev/null || true
          changed=0
          if [ "${code}" = "200" ]; then
            n=$(jq -r '.changes | length // 0' /tmp/monitor.json 2>/dev/null || echo 0)
            [ "${n}" != "0" ] && changed=1
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # Bloque 2: el bucle. Cada tick se agrupa en el log (::group::).
      - name: "Fase 2 · Bucle cada 15 min"
        id: loop
        if: steps.tick.outputs.changed == '0'
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          MINUTES: ${{ github.event.inputs.loop_minutes }}
        run: |
          set -euo pipefail
          end=$(( SECONDS + MINUTES * 60 ))
          tick=1; found=0
          while [ $SECONDS -lt $end ]; do
            tick=$((tick + 1))
            echo "::group::tick ${tick} · $(date -u +%H:%M:%SZ)"
            code=$(curl -sS -o /tmp/monitor.json -w "%{http_code}" \
              "https://frontier-labs-reto.vercel.app/api/monitor/run" \
              -H "Authorization: Bearer ${MONITOR_TOKEN}") || true
            echo "HTTP ${code}"
            cat /tmp/monitor.json 2>/dev/null || true
            if [ "${code}" = "200" ]; then
              c=$(jq -r '.changes | length // 0' /tmp/monitor.json 2>/dev/null || echo 0)
              if [ "${c}" != "0" ]; then
                found=1
                echo "::warning::cambio detectado (${c}) -> se dispara el enjambre"
              fi
            fi
            echo "::endgroup::"
            [ "$found" = "1" ] && break
            remaining=$(( end - SECONDS ))
            [ "$remaining" -le 0 ] && break
            sleep $(( remaining < 900 ? remaining : 900 ))
          done
          echo "changed=${found}" >> "$GITHUB_OUTPUT"
          echo "bucle terminado tras ${tick} ticks (cambio=${found})"

  # --------------------------------------------------- adaptación (enjambre)
  adapt:
    name: Adaptar (enjambre)
    needs: [check, recon, watch]
    if: ${{ always() && (needs.check.outputs.changed == '1' || needs.recon.outputs.changed == '1' || needs.watch.outputs.changed == '1') }}
    uses: ./.github/workflows/swarm.yml
    secrets: inherit
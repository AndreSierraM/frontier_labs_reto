name: swarm

# Enjambre de adaptación. Se dispara cuando el monitor detecta un cambio
# (repository_dispatch) o manualmente. NO empuja a main: abre un PR.
on:
  # Llamado por monitor.yml en el MISMO run (evita la limitación del
  # GITHUB_TOKEN para disparar otros workflows).
  workflow_call:
  repository_dispatch:
    types: [original-changed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  swarm:
    name: Enjambre
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ---- Fase 1 · Base ------------------------------------------------
      - name: "Fase 1 · Checkout"
        uses: actions/checkout@v4

      - name: "Fase 1 · Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Fase 1 · Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Fase 2 · Instalaciones (una por paso) ------------------------
      - name: "Fase 2 · Instalar pi (agente)"
        run: npm install -g @earendil-works/pi-coding-agent@1.1.0

      - name: "Fase 2 · Instalar Vercel CLI (para leer logs)"
        run: npm install -g vercel@54

      - name: "Fase 2 · Dependencias Node"
        run: npm install --no-audit --no-fund

      - name: "Fase 2 · Dependencias Python"
        run: python3 -m pip install --quiet requests

      # ---- Fase 3 · Verificación del entorno ----------------------------
      - name: "Fase 3 · Verificar herramientas"
        run: |
          echo "pi:     $(pi --version 2>/dev/null || echo FALTA)"
          echo "node:   $(node --version)"
          echo "python: $(python3 --version)"
          echo "vercel: $(vercel --version 2>/dev/null || echo FALTA)"
          test -f agent/swarm.mjs && echo "swarm.mjs: ok" || { echo "falta agent/swarm.mjs"; exit 1; }

      # ---- Fase 4 · Ejecución del enjambre ------------------------------
      - name: "Fase 4 · Correr el enjambre"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MONITOR_URL: https://frontier-labs-reto.vercel.app
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          URL_API_ENTRYPOINT: ${{ secrets.URL_API_ENTRYPOINT }}
          TOKEN_CAJA_NEGRA: ${{ secrets.TOKEN_CAJA_NEGRA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: frontier-labs-reto
          VERCEL_SCOPE: cabalastechhub
          MAX_SCOUTS: "2"
          MAX_FIX_ROUNDS: "2"
          SWARM_AGENT_TIMEOUT_MS: "300000"
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: node agent/swarm.mjs

      # ---- Fase 5 · Evidencia -------------------------------------------
      - name: "Fase 5 · Subir artefactos del enjambre"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-artifacts
          path: agent/state/**
          if-no-files-found: ignore
          retention-days: 7

      # ---- Fase 6 · PR ---------------------------------------------------
      - name: "Fase 6 · Abrir PR con la adaptación"
        id: pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "El enjambre no produjo cambios."
            exit 0
          fi
          branch="swarm/adapt-$(date -u +%Y%m%dT%H%M%S)"
          git config user.name "swarm-agent"
          git config user.email "swarm-agent@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "auto(swarm): adaptar reemplazo al cambio detectado"
          git push origin "$branch"
          body_file="$(ls -t agent/state/*/pr-body.md 2>/dev/null | head -1 || true)"
          if [ -n "$body_file" ] && [ -s "$body_file" ]; then
            pr_url=$(gh pr create --title "auto(swarm): adaptación al cambio del original" \
              --body-file "$body_file" --base main --head "$branch")
          else
            pr_url=$(gh pr create --title "auto(swarm): adaptación al cambio del original" \
              --body "PR generado por el enjambre. Revisar diff y tests (merge dispara deploy en Vercel)." \
              --base main --head "$branch")
          fi
          echo "PR: ${pr_url}"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          review_file="$(ls -t agent/state/*/review.md 2>/dev/null | head -1 || true)"
          if [ -n "$review_file" ] && [ -s "$review_file" ]; then
            gh pr comment "$pr_url" --body-file "$review_file" || true
          fi

      - name: "Fase 7 · Reportar al monitor"
        if: always()
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          dir="$(ls -dt agent/state/* 2>/dev/null | head -1 || true)"
          status="failed"; labels=""
          if [ -n "$dir" ] && [ -f "$dir/summary.json" ]; then
            status="$(jq -r '.status' "$dir/summary.json")"
            labels="$(jq -r '(.labels // []) | join(",")' "$dir/summary.json")"
          fi
          cap() { [ -f "$1" ] && head -c 8000 "$1" || true; }
          review="$(cap "$dir/review.md")"
          if [ -z "$review" ] && [ -n "$dir" ] && [ -f "$dir/summary.json" ]; then
            review="$(jq -r '.review // ""' "$dir/summary.json")"
          fi
          scout="$(cap "$(ls "$dir"/scout-*.md 2>/dev/null | head -1)")"
          diagnosis="$(cap "$dir/diagnosis.md")"
          fixer="$(cap "$(ls "$dir"/fixer-*.md 2>/dev/null | head -1)")"
          prbody="$(cap "$dir/pr-body.md")"
          jq -n --arg s "$status" --arg l "$labels" --arg r "$review" --arg ru "$RUN_URL" --arg pu "$PR_URL" \
                --arg scout "$scout" --arg diagnosis "$diagnosis" --arg fixer "$fixer" --arg pr "$prbody" \
            '{status:$s, labels:($l|split(",")|map(select(length>0))), review:$r, runUrl:$ru, prUrl:$pu,
              logs:{scout:$scout, diagnosis:$diagnosis, fixer:$fixer, review:$r, pr:$pr}}' \
            > /tmp/agent.json
          curl -sS -X POST "https://frontier-labs-reto.vercel.app/api/monitor/agent" \
            -H "Authorization: Bearer ${MONITOR_TOKEN}" -H "Content-Type: application/json" \
            --data @/tmp/agent.json || true
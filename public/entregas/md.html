<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento · Entregas Reto 2</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--teal:#0d9488;--teal-2:#115e59;--paper:#fff;--line:#e2e8f0;--aqua:#f0fdfa}
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{width:min(860px,100%);margin:24px auto;padding:28px;background:var(--paper);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.06)}
header{border-bottom:2px solid var(--teal);padding-bottom:12px;margin-bottom:18px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.4px}
.meta{font-size:12px;color:var(--muted);margin:0}
.meta a{color:var(--teal-2);text-decoration:none;font-weight:600}
.meta a:hover{text-decoration:underline}
.md h1{font-size:23px;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.md h2{font-size:18px;margin:22px 0 8px;color:var(--teal-2)}
.md h3{font-size:15px;margin:18px 0 6px}
.md p{margin:10px 0}
.md ul{margin:8px 0;padding-left:22px}
.md li{margin:4px 0}
.md a{color:var(--teal-2)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:#f1f5f9;color:#134e4a;padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.md pre{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
.md pre code{background:none;color:inherit;padding:0}
.md table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
.md th{background:var(--ink);color:#fff;text-align:left;padding:6px 8px}
.md td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.md tr:nth-child(even) td{background:#f8fafc}
.md blockquote{margin:10px 0;padding:8px 12px;background:var(--aqua);border-left:4px solid var(--teal);border-radius:0 8px 8px 0}
.md hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.md img{max-width:100%}
.err{padding:12px;background:#fef2f2;border-left:4px solid #dc2626;border-radius:0 8px 8px 0}
@media(max-width:700px){main{margin:0;border-radius:0;padding:18px}}
</style>
</head>
<body><main>
<header>
<h1 id="docTitle">Documento</h1>
<p class="meta"><a href="index.html">← Entregas</a> · <a id="raw" href="#">Ver original (crudo)</a></p>
</header>
<article id="doc" class="md"><p>Cargando…</p></article>
</main>
<script src="md.js"></script>
<script>
(function () {
  const f = new URLSearchParams(location.search).get("f") || "";
  const doc = document.getElementById("doc");
  const name = f.split("/").pop() || "Documento";
  document.title = name + " · Entregas Reto 2";
  document.getElementById("docTitle").textContent = name;
  const raw = document.getElementById("raw");
  raw.href = f || "#";
  if (!f) {
    doc.innerHTML = '<p class="err">Falta el parámetro <code>?f=archivo.md</code>.</p>';
    return;
  }
  fetch(f)
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status))))
    .then((t) => {
      doc.innerHTML = window.renderMarkdown(t);
      window.rewriteMdLinks(doc);
    })
    .catch((e) => {
      doc.innerHTML = '<p class="err">No se pudo cargar <code>' + f + "</code> (" + e.message + ").</p>";
    });
})();
</script>
</body>
</html>
